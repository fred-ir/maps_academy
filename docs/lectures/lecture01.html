<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Slides test</title>
    <link rel="stylesheet" href="https://unpkg.com/reveal.js/dist/reveal.css">
    <link rel="stylesheet" href="https://unpkg.com/reveal.js/dist/theme/white.css">
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section data-markdown="lecture01_data.md"
               data-separator="^---$"
               data-separator-vertical="^--$"
               data-separator-notes="^Note:">
      </div>
    </div>
    <script src="https://unpkg.com/reveal.js/dist/reveal.js"></script>
    <script src="https://unpkg.com/reveal.js/plugin/markdown/markdown.js"></script>
    <script>
        Reveal.initialize({
        hash: true,
        slideNumber: true,
        plugins: [ RevealMarkdown ]
        });
    </script>
  </body>
</html>
